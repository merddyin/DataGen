name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  dotnet-validation:
    name: Build, Test, and Package Module
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Generate seeded catalog artifact
        shell: pwsh
        run: .\scripts\build-catalog-artifact.ps1 -InstallToCatalogRoot

      - name: Validate repo portability
        shell: pwsh
        run: .\scripts\validate-repo-portability.ps1

      - name: Validate signed release attestation contract
        shell: pwsh
        run: .\tests\CleanCheckoutCatalogContract.Tests.ps1 -SourceRoot $PWD -OutputRoot (Join-Path $env:RUNNER_TEMP 'datagen-release-attestation-contract') -ReleaseWorkflowContractOnly

      - name: Run portable release preflight
        shell: pwsh
        run: .\scripts\invoke-release-preflight.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'datagen-release-preflight')

      - name: Restore solution
        run: dotnet restore .\DataGen.slnx

      - name: Build solution
        run: dotnet build .\DataGen.slnx -v minimal --no-restore

      - name: Validate bundled first-party packs
        shell: pwsh
        run: .\scripts\validate-first-party-packs.ps1

      - name: Run quality validation review
        shell: pwsh
        run: .\scripts\invoke-realism-review.ps1 -OutputPath artifacts\quality\realism-review.md -JsonOutputPath artifacts\quality\realism-review.json -OutputFormat Both -FailOnStatus Fail

      - name: Run solution tests
        run: dotnet test .\DataGen.slnx -v minimal /p:UseSharedCompilation=false -m:1 --no-restore

      - name: Resolve package version
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath 'Directory.Build.props' -Raw
          $versionNode = $props.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $versionNode) {
            throw "Directory.Build.props does not define an authoritative Version."
          }
          $version = $versionNode.InnerText.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Directory.Build.props Version '$version' is not a valid package version."
          }
          "DATAGEN_PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package PowerShell module
        shell: pwsh
        run: .\scripts\package-module.ps1 -Version $env:DATAGEN_PACKAGE_VERSION -Configuration Release

      - name: Verify module package artifact
        shell: pwsh
        run: |
          $packagePath = Join-Path 'artifacts/module' "SyntheticEnterprise.PowerShell-$env:DATAGEN_PACKAGE_VERSION.zip"
          if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
            throw "Expected module package '$packagePath' was not created."
          }

      - name: Upload module package artifact
        uses: actions/upload-artifact@v6
        with:
          name: SyntheticEnterprise.PowerShell-ci-package
          path: artifacts/module/**
          if-no-files-found: error

      - name: Upload seeded catalog artifact
        uses: actions/upload-artifact@v6
        with:
          name: catalogs-sqlite-ci
          path: artifacts/catalog/catalogs.sqlite

      - name: Upload quality validation artifact
        uses: actions/upload-artifact@v6
        with:
          name: quality-validation-ci
          path: artifacts/quality/**

  docs-validation:
    name: Build Docs Site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build Docusaurus site
        working-directory: website
        env:
          DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io
          DOCS_BASE_URL: /${{ github.event.repository.name }}/
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: npm run build
